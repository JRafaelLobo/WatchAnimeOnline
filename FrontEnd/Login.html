<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | AnimeStream</title>
  <style>
    :root {
      --bg: #08090c;
      --panel: rgba(20, 23, 29, 0.94);
      --panel-border: rgba(255, 255, 255, 0.12);
      --accent: #ff640a;
      --accent-hover: #ff7d32;
      --text: #ffffff;
      --muted: #b9bdc5;
      --danger: #ff9d84;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-position: center;
      background-size: cover;
      filter: saturate(0.9);
      transform: scale(1.03);
      transition: background-image 0.5s ease;
    }

    .backdrop::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(8, 9, 12, 0.96) 0%, rgba(8, 9, 12, 0.73) 48%, rgba(8, 9, 12, 0.38) 100%),
        linear-gradient(0deg, rgba(8, 9, 12, 0.98) 0%, transparent 48%, rgba(8, 9, 12, 0.3) 100%);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(8, 9, 12, 0.78);
    }

    .logo {
      color: var(--accent);
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link {
      color: var(--muted);
      font-size: 0.92rem;
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: var(--text);
    }

    main {
      display: grid;
      min-height: calc(100vh - 73px);
      place-items: center;
      padding: 3rem 1.5rem;
    }

    .login-panel {
      width: min(100%, 430px);
      padding: 2.5rem;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      animation: panel-in 0.55s ease both;
    }

    .eyebrow {
      margin-bottom: 0.65rem;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 0.65rem;
      font-size: clamp(2rem, 5vw, 2.65rem);
      line-height: 1.1;
    }

    .intro {
      margin-bottom: 2rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      display: block;
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 0.85rem 0.95rem;
      border: 1px solid #3d424b;
      border-radius: 4px;
      outline: none;
      background: #11141a;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 100, 10, 0.18);
    }

    .submit-button {
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.9rem 1rem;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      transition: background 0.2s, transform 0.2s;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      cursor: wait;
      opacity: 0.7;
      transform: none;
    }

    .message {
      min-height: 1.35rem;
      margin-top: 1rem;
      color: var(--danger);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .register-copy {
      margin-top: 1.8rem;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .register-copy a {
      color: var(--accent);
      text-decoration: none;
    }

    .register-copy a:hover,
    .register-copy a:focus-visible {
      text-decoration: underline;
    }

    @keyframes panel-in {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 1rem 1.25rem;
      }

      .logo {
        font-size: 1.4rem;
      }

      .back-link {
        font-size: 0.82rem;
      }

      .login-panel {
        padding: 2rem 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <header>
    <div class="logo">AnimeStream</div>
  </header>

  <main>
    <section class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Tu próxima historia empieza aquí</p>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="intro">Entra para recibir recomendaciones hechas para ti.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="submit-button" id="submit-button" type="submit">Continuar</button>
        <p class="message" id="message" role="alert" aria-live="polite"></p>
      </form>

      <p class="register-copy">¿Todavía no tienes cuenta? Regístrate</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submit-button');
    const backdrop = document.getElementById('backdrop');

    // El fondo se obtiene de Jikan sin bloquear el formulario si la API no responde.
    async function loadAnimeBackdrop() {
      try {
        const response = await fetch('https://api.jikan.moe/v4/top/anime?limit=1');
        if (!response.ok) return;

        const result = await response.json();
        const image = result.data?.[0]?.images?.jpg?.large_image_url;
        if (image) backdrop.style.backgroundImage = `url("${image}")`;
      } catch (error) {
        console.warn('No se pudo cargar el fondo de anime:', error);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username) {
        message.textContent = 'Escribe tu usuario.';
        return;
      }

      if (!password) {
        message.textContent = 'Escribe una contraseña para continuar.';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Continuando...';

      try {
        const response = await fetch('http://localhost:5001/api/users/check', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username })
        });

        const user = await response.json().catch(() => ({}));

        if (!response.ok) {
          message.textContent = user.error || 'El usuario no existe.';
          return;
        }

        sessionStorage.setItem('animeStreamPendingUser', user.username);
        sessionStorage.setItem('animeStreamUserId', String(user.user_id));
        sessionStorage.setItem('animeStreamMeanScore', String(user.stats_mean_score));
        window.location.href = 'Home.html';
      } catch (error) {
        message.textContent = 'No se pudo conectar con la base de datos.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Continuar';
      }
    });

    loadAnimeBackdrop();
  </script>
</body>
</html>
